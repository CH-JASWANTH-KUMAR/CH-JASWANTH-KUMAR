<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="880" height="180">
  <defs>
    <style><![CDATA[
      text {
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
      }

      /* Base Typographic Classes (Default: Dark Mode) */
      .brand-char {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        font-size: 56px;
        fill: #F8FAFC;
        letter-spacing: -0.02em;
      }

      .mono-label {
        font-family: ui-monospace, 'SF Pro Mono', 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        fill: #94A3B8;
        text-transform: uppercase;
      }

      .secondary-line {
        font-family: ui-monospace, 'SF Pro Mono', 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.16em;
        fill: #CBD5E1;
        text-transform: uppercase;
      }

      .accent-tag {
        font-family: ui-monospace, 'SF Pro Mono', 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.18em;
        fill: #38BDF8;
        text-transform: uppercase;
      }

      .signal-trace {
        stroke: #27272A;
        stroke-width: 1;
      }

      .signal-lead {
        stroke: #38BDF8;
        stroke-width: 1.5;
      }

      .frame-corner {
        stroke: #3F3F46;
        stroke-width: 1;
        fill: none;
      }

      .pulse-node {
        fill: #38BDF8;
      }

      /* Light Theme Override */
      @media (prefers-color-scheme: light) {
        .brand-char { fill: #0F172A; }
        .mono-label { fill: #64748B; }
        .secondary-line { fill: #334155; }
        .accent-tag { fill: #0369A1; }
        .signal-trace { stroke: #E2E8F0; }
        .signal-lead { stroke: #0369A1; }
        .frame-corner { stroke: #CBD5E1; }
        .pulse-node { fill: #0369A1; }
      }
    ]]></style>
  </defs>

  <!-- Framing & Minimal Geometry -->
  <g>
    <path d="M 24 24 L 32 24 M 24 24 L 24 32" class="frame-corner" />
    <path d="M 856 24 L 848 24 M 856 24 L 856 32" class="frame-corner" />
    <text x="40" y="29" class="accent-tag">SIGNAL // 01</text>
    <text x="148" y="29" class="mono-label">SYNTAX</text>
    <text x="856" y="29" text-anchor="end" class="mono-label">BUILDING · TESTING · ITERATING</text>
  </g>

  <!-- Wordmark Letters (J A S W A N T H) -->
  <g transform="translate(0, 0)">
    <text x="40"  y="106" class="brand-char">J</text>
    <text x="84"  y="106" class="brand-char">A</text>
    <text x="136" y="106" class="brand-char">S</text>
    <text x="187" y="106" class="brand-char">W</text>
    <text x="257" y="106" class="brand-char">A</text>
    <text x="309" y="106" class="brand-char">N</text>
    <text x="361" y="106" class="brand-char">T</text>
    <text x="407" y="106" class="brand-char">H</text>
  </g>

  <!-- Baseline Signal Trace -->
  <line x1="24" y1="126" x2="856" y2="126" class="signal-trace" />
  <line x1="24" y1="126" x2="460" y2="126" class="signal-lead" />
  <circle cx="460" cy="126" r="2.5" class="pulse-node" />

  <!-- Secondary Line: Subtitle & Discipline Taxonomy -->
  <text x="40" y="156" class="secondary-line">SOFTWARE ENGINEERING / AI SYSTEMS / PRODUCT EXPERIMENTS</text>

  <!-- Bottom Framing Geometry -->
  <g>
    <path d="M 856 160 L 848 160 M 856 160 L 856 152" class="frame-corner" />
    <path d="M 24 160 L 32 160 M 24 160 L 24 152" class="frame-corner" />
  </g>
</svg>
