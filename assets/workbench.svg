<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 295" width="100%" height="100%" style="background:#0B1220;border-radius:12px;display:block;">
  <defs>
    <style>
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #8B9AA8; letter-spacing: 0.12em; text-transform: uppercase; }
      .flow-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #55D6BE; letter-spacing: 0.06em; }
      .card-header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
      .item-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #E8EDF2; }
      .item-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 400; fill: #6B7C8F; }
      .group-card { fill: #111A2B; stroke: #1E293B; stroke-width: 1; rx: 8px; }
      .item-row { transition: all 0.2s ease; }
    </style>
  </defs>

  <!-- Container Border -->
  <rect x="0.5" y="0.5" width="879" height="294" rx="11.5" fill="none" stroke="#223046" stroke-width="1"/>

  <!-- Header Bar -->
  <g transform="translate(24, 20)">
    <circle cx="5" cy="5" r="4" fill="#55D6BE" opacity="0.9"/>
    <text x="16" y="8.5" class="title-text">THE WORKBENCH</text>
    <text x="832" y="8.5" text-anchor="end" class="flow-text">INTERFACES → SYSTEMS &amp; DATA → APPLIED AI → DELIVERY</text>
  </g>
  <line x1="24" y1="38" x2="856" y2="38" stroke="#1E293B" stroke-width="1"/>

  <!-- ================= CARD 1: INTERFACES ================= -->
  <rect x="24" y="50" width="192" height="225" class="group-card"/>
  <!-- Card Header -->
  <path d="M24 58 a8 8 0 0 1 8 -8 h176 a8 8 0 0 1 8 8 v28 h-192 z" fill="#162238"/>
  <text x="38" y="68" class="card-header" fill="#55D6BE">01 / INTERFACES</text>
  <line x1="24" y1="86" x2="216" y2="86" stroke="#1E293B" stroke-width="1"/>

  <!-- TypeScript -->
  <g transform="translate(38, 102)">
    <rect x="0" y="0" width="20" height="20" rx="3" fill="#3178C6"/>
    <text x="4.5" y="14.5" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFF">TS</text>
    <text x="28" y="14.5" class="item-label">TypeScript</text>
  </g>

  <!-- React -->
  <g transform="translate(38, 138)">
    <g transform="translate(2, 2)">
      <ellipse cx="8" cy="8" rx="7" ry="2.6" fill="none" stroke="#61DAFB" stroke-width="1.2"/>
      <ellipse cx="8" cy="8" rx="7" ry="2.6" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(60 8 8)"/>
      <ellipse cx="8" cy="8" rx="7" ry="2.6" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(120 8 8)"/>
      <circle cx="8" cy="8" r="1.5" fill="#61DAFB"/>
    </g>
    <text x="28" y="14.5" class="item-label">React</text>
  </g>

  <!-- Next.js -->
  <g transform="translate(38, 174)">
    <circle cx="10" cy="10" r="9.5" fill="#000" stroke="#334155" stroke-width="1"/>
    <path d="M6.5 14.5 V5.5 H8.5 L13 12.5 V5.5 H14.5 V14.5 H12.5 L8 7.5 V14.5 Z" fill="#FFF"/>
    <text x="28" y="14.5" class="item-label">Next.js</text>
  </g>

  <!-- Subtext footer in card -->
  <text x="38" y="230" class="item-sub">Typed, reactive, fast frontends</text>
  <text x="38" y="245" class="item-sub">built for real humans.</text>

  <!-- Flow Connector 1 -> 2 -->
  <g transform="translate(216, 150)">
    <line x1="2" y1="0" x2="14" y2="0" stroke="#55D6BE" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>
    <path d="M11 -3 L15 0 L11 3" fill="none" stroke="#55D6BE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ================= CARD 2: SYSTEMS & DATA ================= -->
  <rect x="232" y="50" width="198" height="225" class="group-card"/>
  <path d="M232 58 a8 8 0 0 1 8 -8 h182 a8 8 0 0 1 8 8 v28 h-198 z" fill="#162238"/>
  <text x="246" y="68" class="card-header" fill="#55D6BE">02 / SYSTEMS &amp; DATA</text>
  <line x1="232" y1="86" x2="430" y2="86" stroke="#1E293B" stroke-width="1"/>

  <!-- Node.js -->
  <g transform="translate(246, 96)">
    <path d="M10 2 L17 6 V14 L10 18 L3 14 V6 Z" fill="none" stroke="#68A063" stroke-width="1.5"/>
    <circle cx="10" cy="10" r="2" fill="#68A063"/>
    <text x="26" y="14" class="item-label">Node.js</text>
  </g>

  <!-- Express -->
  <g transform="translate(246, 126)">
    <rect x="1" y="1" width="18" height="18" rx="3" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="4" y="13" font-family="monospace" font-size="9" font-weight="bold" fill="#E8EDF2">ex</text>
    <text x="26" y="14" class="item-label">Express</text>
  </g>

  <!-- FastAPI -->
  <g transform="translate(246, 156)">
    <circle cx="10" cy="10" r="9" fill="#009688"/>
    <path d="M10.5 3.5 L6 10.5 H9.5 L8.5 15.5 L14 8.5 H10.5 Z" fill="#FFF"/>
    <text x="26" y="14" class="item-label">FastAPI</text>
  </g>

  <!-- PostgreSQL -->
  <g transform="translate(246, 186)">
    <circle cx="10" cy="10" r="9" fill="#336791"/>
    <path d="M6 14 C6 9 8 7 10 7 C12 7 14 9 14 14 M8 10 H12 M10 7 V14" fill="none" stroke="#FFF" stroke-width="1.2" stroke-linecap="round"/>
    <text x="26" y="14" class="item-label">PostgreSQL</text>
  </g>

  <!-- MongoDB -->
  <g transform="translate(246, 216)">
    <path d="M10 3 C10 3 6.5 6.5 6.5 10 C6.5 12.5 8 14.5 10 16 C12 14.5 13.5 12.5 13.5 10 C13.5 6.5 10 3 10 3 Z" fill="#13AA52"/>
    <line x1="10" y1="6" x2="10" y2="14" stroke="#FFF" stroke-width="0.8" opacity="0.7"/>
    <text x="26" y="14" class="item-label">MongoDB</text>
  </g>

  <!-- Flow Connector 2 -> 3 -->
  <g transform="translate(430, 150)">
    <line x1="2" y1="0" x2="14" y2="0" stroke="#55D6BE" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>
    <path d="M11 -3 L15 0 L11 3" fill="none" stroke="#55D6BE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ================= CARD 3: APPLIED AI ================= -->
  <rect x="446" y="50" width="196" height="225" class="group-card"/>
  <path d="M446 58 a8 8 0 0 1 8 -8 h180 a8 8 0 0 1 8 8 v28 h-196 z" fill="#162238"/>
  <text x="460" y="68" class="card-header" fill="#E6AA6E">03 / APPLIED AI</text>
  <line x1="446" y1="86" x2="642" y2="86" stroke="#1E293B" stroke-width="1"/>

  <!-- Python -->
  <g transform="translate(460, 102)">
    <g transform="translate(1, 1)">
      <path d="M9 2 C5.5 2 5.5 3.5 5.5 3.5 L5.5 5.5 H9.2 V6.5 H3.8 C2 6.5 2 8.5 2 8.5 C2 9.5 2.5 11 4.5 11 H5.5 V9.5 C5.5 8 7 8 8.5 8 H11.5 C13 8 13.5 7 13.5 5.5 V3.5 C13.5 2 11.5 2 9 2 Z" fill="#3776AB"/>
      <circle cx="7.2" cy="3.5" r="0.8" fill="#FFF"/>
      <path d="M9 16 C12.5 16 12.5 14.5 12.5 14.5 L12.5 12.5 H8.8 V11.5 H14.2 C16 11.5 16 9.5 16 9.5 C16 8.5 15.5 7 13.5 7 H12.5 V8.5 C12.5 10 11 10 9.5 10 H6.5 C5 10 4.5 11 4.5 12.5 V14.5 C4.5 16 6.5 16 9 16 Z" fill="#FFD43B"/>
      <circle cx="10.8" cy="14.5" r="0.8" fill="#1E293B"/>
    </g>
    <text x="28" y="14.5" class="item-label">Python</text>
  </g>

  <!-- LLM integrations -->
  <g transform="translate(460, 142)">
    <circle cx="10" cy="10" r="9" fill="#223046" stroke="#E6AA6E" stroke-width="1"/>
    <path d="M10 4 L11.5 8.5 L16 10 L11.5 11.5 L10 16 L8.5 11.5 L4 10 L8.5 8.5 Z" fill="#E6AA6E"/>
    <text x="28" y="14.5" class="item-label">LLM Integrations</text>
  </g>

  <!-- RAG & vector search -->
  <g transform="translate(460, 182)">
    <circle cx="10" cy="10" r="9" fill="#1B3338" stroke="#55D6BE" stroke-width="1"/>
    <circle cx="10" cy="10" r="3.5" fill="none" stroke="#55D6BE" stroke-width="1"/>
    <line x1="10" y1="3" x2="10" y2="6" stroke="#55D6BE" stroke-width="1.2"/>
    <line x1="10" y1="14" x2="10" y2="17" stroke="#55D6BE" stroke-width="1.2"/>
    <line x1="3" y1="10" x2="6" y2="10" stroke="#55D6BE" stroke-width="1.2"/>
    <line x1="14" y1="10" x2="17" y2="10" stroke="#55D6BE" stroke-width="1.2"/>
    <circle cx="10" cy="10" r="1.2" fill="#55D6BE"/>
    <text x="28" y="14.5" class="item-label">RAG &amp; Vector Search</text>
  </g>

  <text x="460" y="235" class="item-sub">Embeddings, grounded context</text>
  <text x="460" y="250" class="item-sub">&amp; low-latency inference.</text>

  <!-- Flow Connector 3 -> 4 -->
  <g transform="translate(642, 150)">
    <line x1="2" y1="0" x2="14" y2="0" stroke="#55D6BE" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>
    <path d="M11 -3 L15 0 L11 3" fill="none" stroke="#55D6BE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ================= CARD 4: DELIVERY ================= -->
  <rect x="658" y="50" width="198" height="225" class="group-card"/>
  <path d="M658 58 a8 8 0 0 1 8 -8 h182 a8 8 0 0 1 8 8 v28 h-198 z" fill="#162238"/>
  <text x="672" y="68" class="card-header" fill="#55D6BE">04 / DELIVERY</text>
  <line x1="658" y1="86" x2="856" y2="86" stroke="#1E293B" stroke-width="1"/>

  <!-- Docker -->
  <g transform="translate(672, 98)">
    <path d="M17 11.5 C16.5 9 14.5 8.5 14 8.5 C13 7 11.5 6.5 10 6.5 V8.5 H13 C13.5 8.5 14.5 9 15 10.5 C14 10.5 13 11 12 11.5 H3 C2 11.5 1 12.5 1 14 C1 16 3 17 6 17 C11 17 15 15.5 17 11.5 Z" fill="#2496ED"/>
    <rect x="4" y="8" width="2" height="2" fill="#2496ED"/>
    <rect x="7" y="8" width="2" height="2" fill="#2496ED"/>
    <rect x="10" y="8" width="2" height="2" fill="#2496ED"/>
    <rect x="7" y="5.5" width="2" height="2" fill="#2496ED"/>
    <text x="26" y="14" class="item-label">Docker</text>
  </g>

  <!-- AWS -->
  <g transform="translate(672, 130)">
    <path d="M5 14 C8 16 12 16 15 13" fill="none" stroke="#FF9900" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M14 11.5 L16 13 L13.5 14.5" fill="none" stroke="#FF9900" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="2" y="4" width="16" height="8" rx="2" fill="none" stroke="#64748B" stroke-width="1"/>
    <text x="5.5" y="10.5" font-family="sans-serif" font-size="6.5" font-weight="bold" fill="#FF9900">AWS</text>
    <text x="26" y="14" class="item-label">AWS</text>
  </g>

  <!-- Linux -->
  <g transform="translate(672, 162)">
    <rect x="1" y="1" width="18" height="18" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <path d="M5 7 L9 10 L5 13" fill="none" stroke="#55D6BE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="10" y1="13" x2="14" y2="13" stroke="#E8EDF2" stroke-width="1.5" stroke-linecap="round"/>
    <text x="26" y="14" class="item-label">Linux</text>
  </g>

  <!-- Git -->
  <g transform="translate(672, 194)">
    <g transform="translate(2, 2)">
      <path d="M14.5 6.5 L9.5 1.5 C9 1 8 1 7.5 1.5 L1.5 7.5 C1 8 1 9 1.5 9.5 L6.5 14.5 C7 15 8 15 8.5 14.5 L14.5 8.5 C15 8 15 7 14.5 6.5 Z" fill="#F05032"/>
      <circle cx="5.5" cy="8" r="1.2" fill="#FFF"/>
      <circle cx="10.5" cy="5.5" r="1.2" fill="#FFF"/>
      <circle cx="10.5" cy="10.5" r="1.2" fill="#FFF"/>
      <path d="M5.5 8 L10.5 5.5 M5.5 8 L10.5 10.5" stroke="#FFF" stroke-width="1"/>
    </g>
    <text x="26" y="14" class="item-label">Git</text>
  </g>
  <text x="672" y="240" class="item-sub">Repeatable builds &amp; deploys.</text>
</svg>